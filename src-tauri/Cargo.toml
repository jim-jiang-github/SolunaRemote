[package]
name = "solunaremote"
version = "0.4.0"
description = "SolunaRemote desktop app"
authors = ["Jim Jiang"]
edition = "2021"

[features]
microsoft-store = ["dep:windows", "dep:windows-collections"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
if-addrs = "0.13"
aes = "0.8"
base64 = "0.22"
form_urlencoded = "1.2"
mdns-sd = "0.13"
openssl = "0.10"
quick-xml = { version = "0.37", features = ["serialize"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scrypt = "0.11"
sha2 = "0.10"
tauri = { version = "2", features = [] }
url = "2"
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.16"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = ["Foundation_Collections", "Services_Store", "Win32_System_WinRT"] }
windows-collections = { version = "0.3", optional = true }
